services:
  - type: web
    name: normwear-shop
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: normwear-db
          property: connectionString
      - key: SHOP_BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: SHOP_CHANNEL_ID
        sync: false
      - key: SHOP_CHANNEL_USERNAME
        value: normwear_shop
      - key: SHOP_USERNAME
        value: norm_shop_bot
      - key: SUPPLIER_CHANNEL_USERNAME
        value: optobaza
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: SUPPLIER_SESSION_STRING
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: CURRENCY
        value: RUB
      - key: SBP_PROVIDER
        value: manual
      - key: AUTO_PUBLISH
        value: true
      - key: SHOP_CHANNEL_USERNAME
        value: normwear_shop
      - key: SHOP_USERNAME
        value: norm_shop_bot
      - key: SUPPLIER_CHANNEL_USERNAME
        value: optobaza
      - key: DEFAULT_MARGIN_PCT
        value: "35"
      - key: YANDEX_PUBLIC_KEY
        value: https://disk.yandex.ru/d/e4YGRLhebhBoVA
      - key: MOYSKLAD_TOKEN
        sync: false
      - key: SUPPLIER_TELEGRAM_ID
        sync: false
      - key: RUN_BOTS
        value: "false"
databases:
  - name: normwear-db
    plan: free