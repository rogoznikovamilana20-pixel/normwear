services:
  - type: web
    name: normwear-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: normwear-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: normwear-redis
          type: redis
          property: connectionString
      - key: SHOP_BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: SUPPLIER_SESSION_STRING
        sync: false
      - key: SHOP_CHANNEL_ID
        value: -1004387729213
      - key: ADMIN_TELEGRAM_IDS
        value: 1977604257
      - key: MINIAPP_URL_TEMPLATE
        value: https://normwear-api.onrender.com/app/?product={product_id}
      - key: AUTO_PUBLISH
        value: false

  - type: redis
    name: normwear-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: pserv
    name: normwear-shop-bot
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    dockerCommand: python -m app.bot_shop
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: normwear-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: normwear-redis
          type: redis
          property: connectionString
      - key: SHOP_BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: SUPPLIER_SESSION_STRING
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        value: 1977604257
      - key: MINIAPP_URL_TEMPLATE
        value: https://normwear-api.onrender.com/app/?product={product_id}

  - type: pserv
    name: normwear-admin-bot
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    dockerCommand: python -m app.bot_admin
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: normwear-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: normwear-redis
          type: redis
          property: connectionString
      - key: SHOP_BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: SUPPLIER_SESSION_STRING
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        value: 1977604257

  - type: worker
    name: normwear-supplier
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    dockerCommand: python -m app.supplier_daemon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: normwear-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: normwear-redis
          type: redis
          property: connectionString
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: SUPPLIER_SESSION_STRING
        sync: false
      - key: SUPPLIER_CHANNEL_USERNAME
        value: optobaza

databases:
  - name: normwear-db
    plan: free
    databaseName: normwear
    user: normwear
