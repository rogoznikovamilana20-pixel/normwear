services:
  app:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./normwear.db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./normwear.db:/app/normwear.db
      - ./logs:/app/logs
      - ./data/yandex:/app/data/yandex
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning

volumes:
  redis_data:
